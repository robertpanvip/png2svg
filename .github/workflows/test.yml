name: Test Plugin

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test --no-daemon --no-configuration-cache
        continue-on-error: true
        id: test_first

      - name: Retry tests on failure
        if: steps.test_first.outcome == 'failure'
        run: ./gradlew test --no-daemon --no-configuration-cache

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-report
          path: |
            core/build/reports/tests/
            plugin/build/reports/tests/
            core/build/test-results/
            plugin/build/test-results/
